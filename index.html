<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fiadh's Faces</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link 
        rel="stylesheet" 
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    >
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/fiastyles.css">
</head>
<body>

<!-- Loading Screen -->
<div id="loading-screen">
    <div class="spinner-border text-primary" role="status">
        <span class="sr-only">Loading...</span>
    </div>
    <p>Welcome to Fiadh's Faces</p>
</div>

<!-- Nav -->
<nav style="position:fixed;top:0;left:0;right:0;z-index:10001;display:flex;align-items:center;padding:0 20px;height:52px;background:rgba(0,0,0,0.75);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.08);gap:20px;">
  <span style="font-size:15px;font-weight:700;color:#e8c98e;margin-right:auto;">Fiadh's Faces</span>
  <a href="shop/" style="color:rgba(255,255,255,0.6);text-decoration:none;font-size:13px;font-weight:600;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='rgba(255,255,255,0.6)'">Shop</a>
  <a href="studio/" style="color:rgba(255,255,255,0.6);text-decoration:none;font-size:13px;font-weight:600;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='rgba(255,255,255,0.6)'">Studio</a>
  <a href="marketing/" style="color:rgba(255,255,255,0.6);text-decoration:none;font-size:13px;font-weight:600;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='rgba(255,255,255,0.6)'">Marketing</a>
  <button id="toggle-mode" class="btn" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;">Toggle mode</button>
</nav>

<!-- Image Gallery -->
<div id="gallery">
    <!-- Rows will be dynamically added here -->
</div>

<!-- Easter Egg (Hidden) -->
<div id="easter-egg" style="display: none;">
    <p>Fiadh was born on October 21st at 15:37, weighing 2.920kg.</p>
</div>

<!-- Bootstrap JS and dependencies -->
<script 
    src="https://code.jquery.com/jquery-3.5.1.min.js"
></script>
<script 
    src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
></script>
<script 
    src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"
></script>
<!-- Custom JS -->
<script src="js/fiascripts.js"></script>
</body>
</html>
